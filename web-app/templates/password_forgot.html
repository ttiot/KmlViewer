{% extends 'layout.html' %}
{% block title %}Mot de passe oublié · KmlViewer{% endblock %}
{% block content %}
<meta name="csrf-token" content="{{ csrf_token }}">
<section class="panel auth-card" id="forgotCard">
    <h1 class="h4 mb-0">Mot de passe oublié</h1>
    <p class="mb-0" id="forgotMessage" role="status" aria-live="polite">Saisis ton identifiant ou ton adresse e-mail validée.</p>
    <form id="forgotForm" novalidate>
        <div class="mb-2">
            <label class="form-label" for="forgotIdentifier">Identifiant ou adresse e-mail</label>
            <input class="form-control" id="forgotIdentifier" name="identifier" autocomplete="username" maxlength="254"
                   spellcheck="false" autocapitalize="none" required>
        </div>
        <button class="btn btn-primary" type="submit" id="forgotSubmit">Envoyer le lien</button>
        <a class="btn btn-link" href="{{ url_for('auth.password_login') }}">Retour</a>
    </form>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/password-forgot.js') }}"></script>
{% endblock %}
