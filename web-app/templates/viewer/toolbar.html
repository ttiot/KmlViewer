<!-- Ouverture : une activité de la bibliothèque, ou des fichiers (menu « Ouvrir », glisser-déposer) -->
<div class="field">
    <label class="eyebrow" for="activitySelect">Activité</label>
    <div class="open-row">
        <select id="activitySelect" class="form-select">
            <option value="">Choisir dans ma bibliothèque…</option>
        </select>
        <div class="dropdown">
            <button type="button" class="btn btn-outline-secondary dropdown-toggle" id="openMenuButton"
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
                    data-bs-popper-config='{"strategy":"fixed"}'>Ouvrir</button>
            <div class="dropdown-menu dropdown-menu-end open-menu" aria-labelledby="openMenuButton">
                <button type="button" class="dropdown-item" id="chooseFilesButton">Choisir des fichiers…</button>
                <div class="form-check form-switch open-menu-option">
                    <input class="form-check-input" type="checkbox" id="saveToLibrary" checked>
                    <label class="form-check-label" for="saveToLibrary">Enregistrer dans ma bibliothèque</label>
                </div>
                <div class="dropdown-divider"></div>
                <h6 class="dropdown-header">Fichiers d'exemple</h6>
                <div id="sampleFiles">
                    <span class="dropdown-item-text text-muted small">Aucun fichier d'exemple</span>
                </div>
            </div>
        </div>
    </div>
    <!-- Un seul champ de fichiers pour le menu, l'état vide et le glisser-déposer -->
    <input type="file" id="fileInput" accept=".kml,.gpx,.kmz" multiple hidden>
    <!-- Fichiers ouverts : nom (rend le fichier actif), œil, croix -->
    <ul class="file-tabs" id="fileTabs" aria-label="Fichiers ouverts"></ul>
</div>

{% if route_builder_available() %}
<!-- Constructeur de traces (bêta) : absent du HTML quand la fonction ou le moteur n'est pas disponible -->
<div class="field">
    <button type="button" class="btn btn-outline-secondary" id="routeBuilderOpen">Créer une trace</button>
</div>
<section class="rb-panel" id="routeBuilderPanel" aria-label="Créer une trace" hidden>
    <h2 class="eyebrow">Créer une trace</h2>
    <p class="hint">Clique sur la carte pour poser des points (glisse pour déplacer, clic droit pour retirer).
        La trace est une boucle qui les relie dans l'ordre.</p>
    <p class="mono" id="rbCount" aria-live="polite">0 point</p>
    <div class="field"><label for="rbActivity">Activité</label><select id="rbActivity" class="form-select"></select></div>
    <div class="field"><label for="rbDistance">Distance voulue (km)</label>
        <input id="rbDistance" type="number" class="form-control" inputmode="decimal" min="1" step="0.5"></div>
    <div class="button-row">
        <button type="button" class="btn btn-primary" id="rbFinish" disabled>Terminer</button>
        <button type="button" class="btn btn-outline-secondary" id="rbCancel" hidden>Annuler</button>
        <button type="button" class="btn btn-outline-secondary" id="rbUndo" disabled>Annuler le dernier</button>
        <button type="button" class="btn btn-outline-secondary" id="rbRedo" disabled>Rétablir</button>
        <button type="button" class="btn btn-outline-secondary" id="rbClear" disabled>Effacer</button>
        <button type="button" class="btn btn-link" id="rbClose">Fermer</button>
    </div>
    <p class="hint" id="rbMessage" role="status" aria-live="polite"></p>
    <div id="rbResult" hidden>
        <p class="mono" id="rbSummary"></p>
        <ul id="rbWarnings" class="mb-2"></ul>
        <div class="field"><label for="rbName">Nom</label><input id="rbName" class="form-control" maxlength="200"></div>
        <div class="button-row">
            <button type="button" class="btn btn-primary" id="rbSave">Enregistrer</button>
            <button type="button" class="btn btn-outline-secondary" id="rbAnother">Autre proposition</button>
            <button type="button" class="btn btn-outline-secondary" id="rbEdit">Modifier les points</button>
        </div>
        <p class="hint" id="rbSaved" role="status" aria-live="polite"></p>
    </div>
</section>
{% endif %}
