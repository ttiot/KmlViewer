<!-- Ouverture : une activité de la bibliothèque, ou des fichiers (menu « Ouvrir », glisser-déposer) -->
<div class="field">
    <label class="eyebrow" for="activitySelect">Activité</label>
    <div class="open-row">
        <select id="activitySelect" class="form-select">
            <option value="">Choisir dans ma bibliothèque…</option>
        </select>
        <div class="dropdown">
            <button type="button" class="btn btn-outline-secondary dropdown-toggle" id="openMenuButton"
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">Ouvrir</button>
            <div class="dropdown-menu dropdown-menu-end open-menu" aria-labelledby="openMenuButton">
                <button type="button" class="dropdown-item" id="chooseFilesButton">Choisir des fichiers…</button>
                <div class="form-check form-switch open-menu-option">
                    <input class="form-check-input" type="checkbox" id="saveToLibrary" checked>
                    <label class="form-check-label" for="saveToLibrary">Enregistrer dans ma bibliothèque</label>
                </div>
                <div class="dropdown-divider"></div>
                <h6 class="dropdown-header">Fichiers d'exemple</h6>
                <div id="sampleFiles">
                    <span class="dropdown-item-text text-muted small">Aucun fichier d'exemple</span>
                </div>
            </div>
        </div>
    </div>
    <!-- Un seul champ de fichiers pour le menu, l'état vide et le glisser-déposer -->
    <input type="file" id="fileInput" accept=".kml,.gpx,.kmz" multiple hidden>
    <!-- Fichiers ouverts : nom (rend le fichier actif), œil, croix -->
    <ul class="file-tabs" id="fileTabs" aria-label="Fichiers ouverts"></ul>
</div>
