{% extends 'layout.html' %}
{% block title %}Second facteur · KmlViewer{% endblock %}
{% block content %}
<meta name="csrf-token" content="{{ csrf_token }}">
<section class="panel auth-card" id="mfaCard">
    <h1 class="h4 mb-0">Second facteur</h1>
    <p class="mb-0">Saisis le code de ton application d'authentification (6 chiffres) ou un code de secours.</p>
    <p class="mb-0" id="mfaMessage" role="alert" aria-live="polite"></p>
    <form id="mfaForm" autocomplete="off" novalidate>
        <div class="mb-2">
            <label class="form-label" for="mfaCode">Code</label>
            <input class="form-control" id="mfaCode" name="code" inputmode="text" autocomplete="one-time-code" maxlength="32"
                   spellcheck="false" autocapitalize="characters" required>
        </div>
        <button class="btn btn-primary" type="submit" id="mfaSubmit">Valider</button>
        <a class="btn btn-link" href="{{ url_for('auth.password_login') }}">Recommencer</a>
    </form>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/password-mfa.js') }}"></script>
{% endblock %}
