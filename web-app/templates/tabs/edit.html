<div class="tab-pane fade" id="editor" role="tabpanel" aria-labelledby="editor-tab">
    <div class="row g-3">
        <div class="col-12">
            <h3 class="eyebrow mb-2">Points</h3>
            <p class="hint mb-2">
                Les modifications portent sur le fichier affiché, dans le navigateur : utilise l'onglet
                Export pour les enregistrer.
            </p>
            <div class="button-row">
                <button type="button" class="btn btn-outline-secondary" id="addPointBtn">Ajouter un point</button>
                <button type="button" class="btn btn-outline-secondary" id="editPointBtn">Modifier un point</button>
                <button type="button" class="btn btn-outline-danger" id="deletePointBtn">Supprimer un point</button>
            </div>
            <div class="alert alert-info py-2 px-3 mt-2 mb-0 small" id="editorHint" role="status" hidden></div>
        </div>

        <!-- Formulaire d'ajout / de modification de point -->
        <div class="col-12" id="pointEditForm" hidden>
            <div class="card">
                <div class="card-body">
                    <h3 class="eyebrow mb-3" id="pointEditTitle">Modifier le point</h3>
                    <form id="editPointForm">
                        <div class="mb-2">
                            <label class="form-label" for="editPointName">Nom</label>
                            <input type="text" class="form-control" id="editPointName" maxlength="200" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="editPointDescription">Description</label>
                            <textarea class="form-control" id="editPointDescription" rows="2" maxlength="2000"></textarea>
                        </div>
                        <div class="button-row mt-3">
                            <button type="submit" class="btn btn-primary">Enregistrer</button>
                            <button type="button" class="btn btn-outline-secondary" id="cancelPointEditBtn">Annuler</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12">
            <h3 class="eyebrow mb-2">Simplifier les traces</h3>
            <div class="input-group simplify-group">
                <label class="input-group-text" for="simplifyTolerance">Tolérance</label>
                <input type="number" class="form-control" id="simplifyTolerance" value="10" min="1" max="1000" step="1">
                <span class="input-group-text">m</span>
                <button type="button" class="btn btn-outline-secondary" id="simplifyTraceBtn">Simplifier</button>
            </div>
            <div class="hint mt-1">Écart maximal entre la trace d'origine et la trace simplifiée.</div>
        </div>
    </div>
</div>
