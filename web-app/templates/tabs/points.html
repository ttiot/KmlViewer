<div class="tab-pane fade" id="points" role="tabpanel" aria-labelledby="points-tab">
    <!-- Navigation entre les points -->
    <div id="navigationControls" class="points-nav" hidden>
        <div id="navigationInfo" hidden><!-- point courant --></div>
        <div class="button-row">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="prevPointBtn">Précédent</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="nextPointBtn">Suivant</button>
        </div>
        <span class="hint">Les flèches ← → du clavier passent d'un point à l'autre.</span>
    </div>
    <div id="pointsList" class="points-section" hidden>
        <div id="pointsListContent" class="points-list-content"><!-- fenêtre de la liste --></div>
    </div>
    <p class="hint" id="pointsEmpty">Ce fichier ne contient aucun point.</p>
</div>
