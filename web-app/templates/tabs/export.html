<div class="tab-pane fade" id="export" role="tabpanel" aria-labelledby="export-tab">
    <div class="export-layout">
        <div class="field">
            <label for="exportFilename">Nom du fichier</label>
            <input type="text" class="form-control" id="exportFilename" value="trajectory">
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="includeTraces" checked>
            <label class="form-check-label" for="includeTraces">
                Inclure les points de trace et de polygone (CSV uniquement)
            </label>
        </div>
        <div class="button-row" role="group" aria-label="Format d'export">
            <button type="button" class="btn btn-dark" data-export-format="gpx">GPX</button>
            <button type="button" class="btn btn-outline-secondary" data-export-format="kml">KML</button>
            <button type="button" class="btn btn-outline-secondary" data-export-format="geojson">GeoJSON</button>
            <button type="button" class="btn btn-outline-secondary" data-export-format="csv">CSV</button>
        </div>
    </div>
</div>
