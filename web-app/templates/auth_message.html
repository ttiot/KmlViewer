{% extends 'layout.html' %}
{% block title %}{{ title }} · KmlViewer{% endblock %}
{% block content %}
<section class="panel auth-card">
    <h1 class="h4 mb-0">{{ title }}</h1>
    <p class="mb-0">{{ message }}</p>
    {% if show_login %}
    <a class="btn btn-primary align-self-start" href="{{ url_for('auth.login') }}">Se connecter</a>
    {% endif %}
</section>
{% endblock %}
