name: CI et publication de l'image

# Chaîne : tests -> build -> essai de l'image -> scan de vulnérabilités -> publication.
# Rien n'est publié tant que l'image n'a pas démarré et passé le scan (amd64 et arm64) ;
# la publication réutilise les couches des images scannées.
#
# Tags produits :
#   tag git vX.Y.Z      -> X.Y.Z, X.Y, X, latest
#   branche main        -> unstable
#   autre branche       -> unstable-<branche>
#   chaque build        -> sha-<commit>
#   chaque lundi (cron) -> reconstruction sans cache de la dernière release, pour embarquer
#                          les correctifs de l'image de base : X.Y.Z, X.Y, X, latest sont rafraîchis

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Moindre privilège par défaut ; chaque job élargit ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  test:
    name: Tests et audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Les tests tournent dans l'image de base du Dockerfile (même Python, même SQLite que
      # la production) : la référence est lue dans le Dockerfile, pas dupliquée ici.
      - name: Image de test (lue dans le Dockerfile)
        id: pyimage
        run: |
          image=$(sed -n 's/^FROM \(python:[^ ]*\)\( .*\)\{0,1\}$/\1/p' web-app/Dockerfile | tail -n 1)
          re='^python:[0-9]+\.[0-9]+(\.[0-9]+)?-slim$'
          [[ "$image" =~ $re ]] || { echo "Image introuvable : '$image'" >&2; exit 1; }
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Lint et tests dans l'image (verrou à empreintes)
        env:
          PYTEST_IMAGE: ${{ steps.pyimage.outputs.image }}
        run: |
          docker run --rm \
            --volume "$PWD/web-app:/app" --workdir /app \
            --env PIP_ROOT_USER_ACTION=ignore --env PIP_DISABLE_PIP_VERSION_CHECK=1 \
            --env PIP_NO_CACHE_DIR=1 --env PYTHONDONTWRITEBYTECODE=1 \
            "$PYTEST_IMAGE" bash -euo pipefail -c '
              python --version
              python -c "import sqlite3; print(\"SQLite\", sqlite3.sqlite_version)"
              pip install --require-hashes -r requirements.txt -r requirements-dev.txt
              python -m ruff check .
              python -m pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=75
            '

      - name: Vulnérabilités connues des dépendances
        run: pipx run pip-audit==2.10.1 --require-hashes --disable-pip -r web-app/requirements.txt

  image:
    name: Build, essai, scan et publication de l'image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      # Cron : on reconstruit la dernière release, pas la branche principale.
      - name: Détermination de la version
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          tag=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            tag=$(git ls-remote --tags --refs --sort=-v:refname \
              "https://github.com/${GITHUB_REPOSITORY}.git" 'v*.*.*' | head -n 1 | sed 's#.*refs/tags/##')
          fi
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "tag=${tag}"
            echo "ref=${tag:-$GITHUB_SHA}"
            echo "app_version=${tag:-unstable-${GITHUB_SHA::7}}"
            echo "ghcr_image=${REGISTRY_GHCR}/${GITHUB_REPOSITORY,,}"
            echo "hub_image=${DOCKERHUB_USERNAME}/${repo,,}"
            # Release ou cron : sans cache, pour rejouer les mises à jour de sécurité système
            if [[ -n "$tag" ]]; then echo "no_cache=true"; else echo "no_cache=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.version.outputs.ref }}
          persist-credentials: false

      - name: Configuration de QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build de l'image candidate (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./web-app
          file: ./web-app/Dockerfile
          load: true
          pull: true
          no-cache: ${{ steps.version.outputs.no_cache }}
          tags: kml-viewer:candidate
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # L'image arm64 est publiée elle aussi : elle passe le même scan avant
      - name: Build de l'image candidate (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./web-app
          file: ./web-app/Dockerfile
          platforms: linux/arm64
          load: true
          pull: true
          no-cache: ${{ steps.version.outputs.no_cache }}
          tags: kml-viewer:candidate-arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Essai de l'image dans les conditions de production
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          docker run -d --name candidate \
            --read-only --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001,mode=700 \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:5000:5000 kml-viewer:candidate

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health -o health.json; then break; fi
            sleep 2
          done
          cat health.json || { docker logs candidate; exit 1; }

          python3 - <<'PY'
          import json, os, urllib.request
          health = json.load(open("health.json"))
          assert health["status"] == "healthy", health
          assert health["version"] == os.environ["EXPECTED_VERSION"], health
          for path in ("/", "/dashboard", "/segments", "/api/activities"):
              assert urllib.request.urlopen("http://127.0.0.1:5000" + path, timeout=10).status == 200, path
          PY

          if docker logs candidate 2>&1 | grep -i -E "error|traceback"; then
            echo "Erreurs dans les logs du conteneur" >&2
            exit 1
          fi
          test "$(docker exec candidate id -u)" = "10001"
          docker rm -f candidate

      - name: Scan de vulnérabilités (Trivy, amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: kml-viewer:candidate
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan de vulnérabilités (Trivy, arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: kml-viewer:candidate-arm64
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Pas de publication pour une pull request ni pour une branche poussée par Dependabot :
      # ses exécutions n'ont pas accès aux secrets des registres, la connexion échouerait.
      # L'image y est quand même construite, essayée et scannée.
      - name: Connexion à GitHub Container Registry
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags et labels de l'image
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ${{ steps.version.outputs.ghcr_image }}
            ${{ steps.version.outputs.hub_image }}
          flavor: |
            latest=${{ steps.version.outputs.tag != '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=raw,value=unstable,enable=${{ steps.version.outputs.tag == '' && github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=unstable-,enable=${{ steps.version.outputs.tag == '' && github.ref != 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}

      - name: Build multi-architecture et publication
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./web-app
          file: ./web-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Ni pull ni no-cache : les couches publiées sont celles des images candidates,
          # qui viennent d'être essayées et scannées (elles-mêmes reconstruites sans cache
          # pour une release). Reconstruire ici publierait une image que personne n'a vue.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          provenance: mode=max
          sbom: true

      - name: Résumé
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          {
            echo "## Image publiée"
            echo ""
            echo "- Version : \`${APP_VERSION}\`"
            echo "- Empreinte : \`${DIGEST}\`"
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
