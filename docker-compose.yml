services:
  kml-viewer:
    build:
      context: ./web-app
      args:
        # Renseignée par start.sh (tag git du commit courant, sinon empreinte courte)
        APP_VERSION: ${APP_VERSION:-dev}
    image: kml-viewer:local
    container_name: kml-viewer-app
    ports:
      # Écoute locale uniquement : exposer via un reverse proxy TLS (HAProxy, Traefik…)
      - "127.0.0.1:8080:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - FLASK_ENV=production
      - DATA_DIR=/data
      - INBOX_DIR=/inbox
      # Correction d'altitude : http://opentopodata:5000/v1/copernicus30 avec le profil « dem »
      - DEM_URL=${DEM_URL:-}
    volumes:
      # Base SQLite + fichiers d'origine
      - kml-viewer-data:/data
      # Dossier surveillé : un sous-dossier par utilisateur (username ou email)
      - ./inbox:/inbox:ro
      # Fichiers d'exemple, visibles de tous les comptes : un dossier dédié, jamais la racine
      # du projet (elle contient .env, .git et l'inbox de tout le monde)
      - ./web-app/sample_files:/app/sample_files:ro
    read_only: true
    # Un fichier hostile ne doit pas pouvoir épuiser la mémoire de l'hôte
    mem_limit: ${KMLVIEWER_MEM_LIMIT:-2g}
    pids_limit: 256
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - routing
    restart: unless-stopped

  # --- Correction d'altitude (optionnel) : docker compose --profile dem up -d ---------

  # Tâche ponctuelle : télécharge les dalles Copernicus GLO-30 couvrant DEM_BBOX
  # (~45 Mo par dalle de 1°x1°). Relançable sans risque : seules les dalles manquantes sont prises.
  # Avec ROUTING_ZONE_BUILD=1, lancée par routing/update.sh (DEM_BBOX dérivée de l'emprise d'extraction, DEM_BBOX du .env ignorée) :
  # profil d'outillage en plus de « dem ». Avec =0 : `docker compose --profile dem run --rm dem-tiles` à la main (DEM_BBOX).
  dem-tiles:
    profiles: ["dem", "routing-tools"]
    build: ./web-app
    image: kml-viewer:local
    command: ["python", "-m", "app.services.dem_tiles"]
    environment:
      - DEM_BBOX=${DEM_BBOX:-}
      - DEM_TILES_DIR=/dem/copernicus30
    volumes:
      - dem-data:/dem
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # API d'altitude locale : les traces ne sortent pas de la machine. Pas d'image publiée
  # par le projet : build depuis le dépôt, épinglé sur un commit (version 1.10.2).
  opentopodata:
    profiles: ["dem"]
    build:
      context: https://github.com/ajnisbet/opentopodata.git#2f365f8d9018aea7b3d70a762bc8c29515c9dd1b
      dockerfile: docker/Dockerfile
    image: opentopodata:1.10.2
    # Ne dépend plus de dem-tiles (ZD-1, inventaire n° 13) : les dalles sont téléchargées par la tâche de l'hôte, qui relance
    # ce service quand des dalles sont ajoutées (routing/zone_update.py)
    volumes:
      # nocopy : ce conteneur (root) ne doit pas initialiser le volume, sinon le
      # téléchargeur non-root ne pourrait plus y écrire
      - type: volume
        source: dem-data
        target: /app/data
        read_only: true
        volume:
          nocopy: true
      - ./dem/opentopodata.yaml:/app/config.yaml:ro
    # Aucun port publié : joignable uniquement par kml-viewer sur le réseau interne
    expose:
      - "5000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # --- Routage (traces planifiées, ADR-0007) : docker compose --profile routing up -d ---------

  # Moteur GraphHopper auto-hébergé. Aucun port publié : joignable uniquement par kml-viewer sur
  # le réseau interne (ROUTING_BASE_URL=http://graphhopper:8989, à autoriser dans OUTBOUND_ALLOWED_HOSTS
  # par routing=graphhopper:8989). Le graphe est produit par routing/update.sh (jamais au démarrage).
  # Sans graphe, le conteneur s'arrête en erreur et redémarre : lancer d'abord routing/update.sh.
  graphhopper:
    profiles: ["routing"]
    build:
      context: ./routing
    image: kml-viewer-graphhopper:11.0
    environment:
      # Valeurs dimensionnées pour dune (V-Z2, zone par défaut : graphe de 662 Mo, 3,28 Gio de pic après charge) : -Xmx3g dans
      # 5 Gio. Autre machine : règle de dimensionnement de routing-zone-donnees ZD-4 (à régler dans .env).
      JAVA_OPTS: "-Xmx${ROUTING_XMX:-3g} -XX:+ExitOnOutOfMemoryError"
    volumes:
      # écriture requise : GraphHopper pose un verrou (gh.lock) dans le dossier du graphe ; le reste
      # du système de fichiers du conteneur est en lecture seule
      - routing-data:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${ROUTING_MEM_LIMIT:-5g}
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - routing
    expose:
      - "8989"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8989 &&
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # --- Chaîne de données du routage : lancée par routing/update.sh, jamais à la main ---------
  # Tâches ponctuelles, sans port publié ; seules celles qui téléchargent ont un réseau.

  # Initialise le volume routing-data (propriétaire 10002) et y crée les dossiers.
  routing-init:
    profiles: ["routing-tools"]
    image: kml-viewer-graphhopper:11.0
    entrypoint: ["mkdir", "-p", "/data/in", "/data/graphs"]
    volumes:
      - routing-data:/data
    network_mode: none
    read_only: true
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # État de confiance de la tâche hôte (budget, étape en suspens, catalogue, dalles) ET cache des extraits, recadrés, fusionné :
  # volume SÉPARÉ, jamais monté par le moteur, qui ne voit que routing-data (graphs/) (ZD-9.0). Crée /state au premier passage (volume neuf : propriétaire root).
  routing-state-init:
    profiles: ["routing-tools"]
    image: kml-viewer-graphhopper:11.0
    user: "0"
    # chmod AVANT chown (après, root n'est plus propriétaire et chmod exige CAP_FOWNER) ; la garde rend l'opération idempotente
    entrypoint: ["sh", "-c", "[ \"$(stat -c %u:%a /state)\" = 10002:700 ] || { chmod 700 /state && chown 10002:10002 /state; }"]
    volumes:
      - routing-state:/state
    network_mode: none
    read_only: true
    pids_limit: 64
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Téléchargement des extraits Geofabrik : seule tâche avec accès réseau (réseau par défaut).
  routing-fetch:
    profiles: ["routing-tools"]
    image: kml-viewer-graphhopper:11.0
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    volumes:
      - routing-state:/state
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Opérations sur le volume (lien courant, suppressions, contrôles) : aucun réseau, moindre privilège.
  routing-volume:
    profiles: ["routing-tools"]
    image: kml-viewer-graphhopper:11.0
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    volumes:
      - routing-data:/data
      - routing-state:/state
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Recadrage de chaque extrait puis fusion des recadrés (osmium) : pas d'outil de fusion dans l'image de l'appli ni du moteur.
  routing-merge:
    profiles: ["routing-tools"]
    image: iboates/osmium@sha256:ce46c6bc52b42899ae53a46b1a9e05c0f5fce964bf4974ed5c07a90f4d2b7679
    user: "10002:10002"
    volumes:
      - routing-state:/state
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${ROUTING_OSMIUM_MEM_LIMIT:-4g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Mode historique (ROUTING_ZONE_BUILD=0, routing/update.sh) : mêmes tâches, montées sur routing-data (/data/in) comme avant.
  routing-fetch-legacy:
    profiles: ["routing-tools"]
    image: kml-viewer-graphhopper:11.0
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    volumes:
      - routing-data:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  routing-merge-legacy:
    profiles: ["routing-tools"]
    image: iboates/osmium@sha256:ce46c6bc52b42899ae53a46b1a9e05c0f5fce964bf4974ed5c07a90f4d2b7679
    user: "10002:10002"
    volumes:
      - routing-data:/data
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${ROUTING_OSMIUM_MEM_LIMIT:-4g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Import GraphHopper dans un dossier neuf (l'ancien graphe sert jusqu'à la bascule).
  routing-import:
    profiles: ["routing-tools"]
    image: kml-viewer-graphhopper:11.0
    command: ["import"]
    environment:
      # Dimensionné pour dune (V-Z2 : zone par défaut, fichier recadré de 1,956 Go, tas 4,4 Go, pic 5,2 Gio, 287 s) :
      # -Xmx8g dans 10 Gio, pour un fichier de ROUTING_MAX_IMPORT_BYTES (2,4 Go) au plus. Autre machine : règle de ZD-4.
      JAVA_OPTS: "-Xmx${ROUTING_IMPORT_XMX:-8g} -XX:+ExitOnOutOfMemoryError"
      GH_PBF: ${ROUTING_IMPORT_PBF:-/data/in/hdf-be.osm.pbf}
      GH_GRAPH: ${ROUTING_IMPORT_GRAPH:-/data/graphs/import}
    volumes:
      - routing-data:/data
      - routing-state:/state:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${ROUTING_IMPORT_MEM_LIMIT:-10g}
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  kml-viewer-data:
  dem-data:
  routing-data:
  routing-state:

networks:
  default:
    name: kml-viewer-network
  # Réseau du moteur de routage : interne (aucun accès sortant), partagé par kml-viewer et graphhopper seulement
  routing:
    name: kml-viewer-routing
    internal: true
